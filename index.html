<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroForte AI - Startup Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login">
  <div class="login-box">
    <h2>🌱 AgroForte AI</h2>
    <p>Entre no sistema inteligente do campo</p>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button id="loginBtn">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

<header class="topbar">
  <h1>AgroForte AI Dashboard</h1>
  <div class="status">🟢 Sistema online</div>
</header>

<!-- SIDEBAR -->
<aside class="sidebar">
  <button onclick="show('dash')">📊 Dashboard</button>
  <button onclick="show('data')">🌾 Dados</button>
  <button onclick="show('ai')">🧠 IA</button>
  <button onclick="show('chat')">💬 Comunidade</button>
  <button id="theme">🌙 Tema</button>
</aside>

<main>

<!-- DASHBOARD -->
<section id="dash" class="section active">

  <div class="cards">

    <div class="card">
      <h3>🌱 Produtividade</h3>
      <canvas id="c1"></canvas>
    </div>

    <div class="card">
      <h3>💧 Água</h3>
      <canvas id="c2"></canvas>
    </div>

    <div class="card">
      <h3>🌎 Carbono</h3>
      <canvas id="c3"></canvas>
    </div>

  </div>

</section>

<!-- DATA -->
<section id="data" class="section">

<h2>📡 Dados Agrícolas em Tempo Real</h2>

<div id="apiBox" class="api"></div>

</section>

<!-- IA -->
<section id="ai" class="section">

<h2>🧠 Inteligência Artificial</h2>

<div class="grid">

<div class="box">Monitoramento de lavouras</div>
<div class="box">Previsão climática IA</div>
<div class="box">Detecção de pragas</div>
<div class="box">Automação agrícola</div>

</div>

</section>

<!-- CHAT -->
<section id="chat" class="section">

<h2>💬 Comunidade Agro</h2>

<textarea id="msg"></textarea>
<button id="send">Enviar</button>

<div id="list"></div>

</section>

</main>

</div>

<script src="script.js"></script>
</body>
</html>
